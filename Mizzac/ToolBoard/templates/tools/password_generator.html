{% extends 'common/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="display-4">Générateur de mots de passe</h1>
    <p>Générez des mots de passe sécurisés.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="length">Longueur du mot de passe</label>
            <input type="number" class="form-control" id="length" name="length" value="12">
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="include_uppercase" name="include_uppercase" checked>
            <label class="form-check-label" for="include_uppercase">Inclure des majuscules</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="include_numbers" name="include_numbers" checked>
            <label class="form-check-label" for="include_numbers">Inclure des chiffres</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="include_symbols" name="include_symbols">
            <label class="form-check-label" for="include_symbols">Inclure des symboles</label>
        </div>
        <button type="submit" class="btn btn-primary mt-2">Générer</button>
    </form>
    {% if password %}
        <hr>
        <h3>Mot de passe généré</h3>
        <p><strong>{{ password }}</strong></p>
    {% endif %}
</div>
{% endblock %}

{% load static %}

<form method="post" action="{% url 'fundboard:delete_account_modal' object.pk %}">
  {% csrf_token %}
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0">
      <div class="modal-header">
        <h2 class="modal-title h3">Archiver le compte ?</h2>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <p>Archiver <strong>{{ object.name }}</strong> ?</p>
        <p class="text-secondary mb-0">Ses données et son historique seront conservés.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-warning">Archiver</button>
      </div>
    </div>
  </div>
</form>

{% load static %}

<form method="post" action="{% url 'fundboard:delete_account_modal' object.pk %}">
  {% csrf_token %}
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0">
      <div class="modal-header">
        <h5 class="modal-title text-danger">Supprimer le compte ?</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Supprimer <strong>{{ object.name }}</strong>&nbsp;? Cette action est <strong>irréversible</strong>.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-danger">Supprimer</button>
      </div>
    </div>
  </div>
</form>

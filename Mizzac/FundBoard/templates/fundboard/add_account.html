{% extends 'common/base.html' %}

{% block content %}

<div class="container mt-4">
    <h2>Ajouter un Compte Bancaire</h2>
    <hr>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Ajouter</button>
        <a href="{% url 'fundboard:accounts' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>

{% endblock %}

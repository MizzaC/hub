{% extends 'common/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Supprimer l'Abonnement</h2>
    <hr>
    
    <p>Êtes-vous sûr de vouloir supprimer l'abonnement <strong>{{ object.nom }}</strong> ? Cette action est irréversible.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmer la Suppression</button>
        <a href="{% url 'fundboard:subscriptions' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: tests-only-key-with-more-than-fifty-characters-never-use-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: testserver,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: make ci
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:assets
      - run: git diff --exit-code -- Mizzac/Core/static/core/vendor Mizzac/Core/templates/core/icons

